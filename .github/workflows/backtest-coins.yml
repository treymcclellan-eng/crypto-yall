name: Backtest Coin Check

# Manual only. Coin check: replays candidate new coins (XLM, TAO, ONDO, HBAR) on ~100 days of Hyperliquid 30-min
# candles and compares rule changes. Places no orders and uses no secrets.
# Results are committed to the `backtest-results-coins` branch (results/report.md).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run replay
        run: python backtest_coins.py --out results

      - name: Job summary
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results-coins
          path: results/

      - name: Commit results to backtest-results-coins branch
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git checkout --orphan backtest-results-coins
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f results
          git commit -m "Backtest results $(date -u +%Y-%m-%d_%H%M)"
          git push --force origin backtest-results-coins
